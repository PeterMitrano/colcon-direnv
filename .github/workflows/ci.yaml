name: Run tests

on:
  push:
    branches: ['main']
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest            # same as the reused workflow
    steps:
      - uses: actions/checkout@v3

      - name: install direnv
        run: |
          sudo apt-get update
          sudo apt-get install -y direnv \
          python3-colcon-argcomplete \
          python3-colcon-bash \
          python3-colcon-cd \
          python3-colcon-clean \
          python3-colcon-cmake \
          python3-colcon-common-extensions \
          python3-colcon-core \
          python3-colcon-defaults \
          python3-colcon-devtools \
          python3-colcon-installed-package-information \
          python3-colcon-library-path \
          python3-colcon-metadata \
          python3-colcon-mixin \
          python3-colcon-output \
          python3-colcon-override-check \
          python3-colcon-package-information \
          python3-colcon-package-selection \
          python3-colcon-parallel-executor \
          python3-colcon-pkg-config \
          python3-colcon-powershell \
          python3-colcon-python-setup-py \
          python3-colcon-recursive-crawl \
          python3-colcon-ros \
          python3-colcon-test-result

      - name: install colcon-direnv
        run: |
          pip install --break-system-packages .

      - name: run tests
        run: |
          pytest -v test
