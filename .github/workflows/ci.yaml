name: Run tests

on:
  push:
    branches: ['main']
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest            # same as the reused workflow
    steps:
      - uses: actions/checkout@v3

      - name: install direnv
        run: |
          sudo apt-get update
          sudo apt-get install -y direnv

      # now call the reusable workflow; it will run in the same runner
      - uses: colcon/ci/.github/workflows/pytest.yaml@main
