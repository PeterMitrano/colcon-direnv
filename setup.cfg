[metadata]
name = colcon_direnv
version = attr: colcon_direnv.__version__
url = https://colcon.readthedocs.io
project_urls =
    Changelog = https://github.com/petermitrano/colcon_direnv/milestones?direction=desc&sort=due_date&state=closed
    GitHub = https://github.com/petermitrano/colcon_direnv/
author = Peter Mitrano
author_email = mitranopeter@gmail.com
maintainer = Peter Mitrano
maintainer_email = mitranopeter@gmail.com
classifiers =
    Development Status :: 3 - Alpha
    Environment :: Plugins
    Intended Audience :: Developers
    License :: OSI Approved :: Apache Software License
    Operating System :: MacOS
    Operating System :: Microsoft :: Windows
    Operating System :: POSIX
    Programming Language :: Python
    Topic :: Software Development :: Build Tools
license = Apache License, Version 2.0
description = Extension for colcon to create and configure COLCON_DEFAULTS
long_description = file: README.md
long_description_content_type = text/markdown
keywords = colcon

[options]
python_requires = >=3.6
install_requires =
  colcon-core>=0.5.2
  jinja2
  scandir;platform_system=='Windows'
packages = find:
zip_safe = true

[options.extras_require]
test =
  colcon_direnv # What does this mean?
  colcon-test-result>=0.3.8
  pep8-naming
  pylint
  pytest
  scspell3k>=2.2

[options.packages.find]
exclude = test

[tool:pytest]
filterwarnings =
    error
    ignore:lib2to3 package is deprecated::scspell
    ignore::pytest.PytestUnraisableExceptionWarning
markers =
    linter

[options.entry_points]
colcon_core.verb =
    direnv = colcon_direnv.verb.direnv:direnvVerb
