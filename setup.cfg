[metadata]
name = colcon_direnv
version = attr: colcon_direnv.__version__
url = https://colcon.readthedocs.io
project_urls =
    Changelog = https://github.com/petermitrano/colcon_direnv/milestones?direction=desc&sort=due_date&state=closed
    GitHub = https://github.com/petermitrano/colcon_direnv/
author = Peter Mitrano
author_email = mitranopeter@gmail.com
maintainer = Peter Mitrano
maintainer_email = mitranopeter@gmail.com
classifiers =
    Development Status :: 3 - Alpha
    Environment :: Plugins
    Intended Audience :: Developers
    License :: OSI Approved :: Apache Software License
    Operating System :: MacOS
    Operating System :: Microsoft :: Windows
    Operating System :: POSIX
    Programming Language :: Python
    Topic :: Software Development :: Build Tools
license = Apache License, Version 2.0
description = Extension for colcon to create and configure COLCON_DEFAULTS
long_description = file: README.md
long_description_content_type = text/markdown
keywords = colcon

[options]
python_requires = >=3.6
install_requires =
  colcon-core>=0.5.2
  jinja2
  scandir;platform_system=='Windows'
packages = find:
zip_safe = true

[options.extras_require]
test =
  colcon_direnv # What does this mean?
  colcon-test-result>=0.3.8
  flake8>=3.6.0
  flake8-blind-except
  flake8-builtins
  flake8-class-newline
  flake8-comprehensions
  flake8-deprecated
  flake8-docstrings
  flake8-import-order
  flake8-quotes
  pep8-naming
  pylint
  pytest
  pytest-cov
  scspell3k>=2.2

[options.packages.find]
exclude = test

[tool:pytest]
filterwarnings =
    error
    ignore::DeprecationWarning:flake8:
    ignore::DeprecationWarning:scantree.*:
    ignore:lib2to3 package is deprecated::scspell
    ignore::pytest.PytestUnraisableExceptionWarning
markers =
    flake8
    linter

[options.entry_points]
colcon_core.verb =
    direnv = colcon_direnv.verb.direnv:direnvVerb

[flake8]
import-order-style = google

[coverage:run]
branch = True
source = colcon_direnv

[coverage:report]
exclude_lines =
    # Have to re-enable the standard pragma
    pragma: no cover
    # Don't complain if tests don't hit defensive assertion code:
    raise NotImplementedError()
    # Don't complain if non-runnable code isn't run:
    pass
